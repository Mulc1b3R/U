<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOVEREIGN .BIO HOLOGRAM</title>
<style>
  :root { --bg:#0c0e11; --panel:#14181f; --border:#262d38; --accent:#00e5a8; --accent2:#f59e0b; --danger:#ef4444; --text:#e6edf3; --muted:#8b949e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',Consolas,monospace; display:flex; height:100vh; overflow:hidden; }
  #sidebar { width:310px; background:var(--panel); border-right:1px solid var(--border); padding:18px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
  h1 { font-size:15px; letter-spacing:1.5px; color:var(--accent); text-transform:uppercase; }
  label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:5px; }
  select, input, textarea, button { width:100%; padding:9px 11px; background:#0c0e11; color:var(--text); border:1px solid var(--border); border-radius:5px; font-family:inherit; font-size:13px; }
  textarea { resize:vertical; line-height:1.45; }
  button { cursor:pointer; background:#19222c; border-color:var(--accent); color:var(--accent); font-weight:600; }
  button:hover { background:var(--accent); color:#08100d; }
  .btn-sec { border-color:var(--border); color:var(--text); background:#181d26; }
  .btn-del { border-color:#4c1d1d; color:var(--danger); background:#1f1215; width:auto; padding:5px 10px; font-size:11px; }
  .tabs { display:flex; gap:6px; }
  .tabs button.active { background:var(--accent); color:#08100d; }
  .card, .ed-group { background:#0c0e11; border:1px solid var(--border); border-radius:6px; padding:12px; font-size:12px; display:flex; flex-direction:column; gap:8px; }
  .ed-group { background:var(--panel); padding:16px; }
  .tag { display:inline-block; background:#1c2530; color:var(--accent2); border:1px solid #382e1c; padding:2px 7px; border-radius:4px; font-size:11px; margin:2px 3px 2px 0; }
  #main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #chat-view { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  #chat { flex:1; padding:24px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
  .msg { max-width:820px; padding:14px 18px; border-radius:8px; line-height:1.55; font-size:14px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#1b2836; border:1px solid #2b4259; }
  .bio { align-self:flex-start; background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--accent); }
  .meta { font-size:11px; color:var(--muted); margin-bottom:6px; }
  #input-bar { display:flex; gap:10px; padding:16px 24px; background:var(--panel); border-top:1px solid var(--border); }
  #editor-view { display:none; flex:1; padding:24px 32px; overflow-y:auto; flex-direction:column; gap:16px; max-width:960px; }
  .mem-row { display:flex; gap:8px; align-items:center; }
</style>
</head>
<body>
  <script src="bio_hex.js"></script>
<script src="bio_app.js"></script>

</body>
</html>
